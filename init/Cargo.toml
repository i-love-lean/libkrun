[package]
name = "krun-init"
version = "0.1.0-2.0.0-dev"
edition = "2024"
description = "PID-1 init binary for libkrun guest VMs"
license = "Apache-2.0"
repository = "https://github.com/containers/libkrun"

[[bin]]
name = "krun-init"
path = "src/main.rs"

[features]
amd-sev = []
tdx = []
timesync = []

[dependencies]
anyhow = "1"
libc = "0.2"
nix = { version = "0.30", features = ["fs", "hostname", "ioctl", "mount", "net", "process", "reboot", "resource", "signal", "socket", "term", "time", "uio"] }
rand = "0.10.2"
russh = "0.62.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2.0.1"
tokio = { version = "1.53.1", features = ["process"] }
tokio-vsock = "0.7.2"
